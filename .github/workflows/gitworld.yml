name: GitWorld city

on:
  schedule:
    - cron: "17 * * * *" # every hour, so repo changes (made public/private, new commits) show up soon
  workflow_dispatch:
    inputs:
      theme:
        description: "Pick a theme. It stays until you pick another (Diwali, Holi, Halloween and New Year still get their festival theme for a few days)."
        type: choice
        default: keep-current
        options:
          - keep-current
          - rotate
          - random
          - classic-blue
          - synthwave
          - neon-rain
          - winter-night
          - diwali
          - pastel-day
          - github-light
          - sakura-dusk
          - golden-hour
          - gameboy
          - mars-colony
          - underwater
          - matrix
          - aurora
          - cyberpunk
          - autumn
          - halloween
          - new-year
          - holi
          - noir
          - desert-oasis
          - lunar-base
  push:
    branches: [main]
    paths: ["gitworld/**", "gitworld.config.json", ".github/workflows/gitworld.yml"]

permissions:
  contents: write

concurrency:
  group: gitworld
  cancel-in-progress: false # never cancel a run that is saving your theme choice

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save your theme choice
        if: github.event.inputs.theme && github.event.inputs.theme != 'keep-current'
        env:
          THEME: ${{ github.event.inputs.theme }}
        run: |
          node -e '
            const fs = require("fs"), f = "gitworld.config.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.theme = process.env.THEME; c.light_theme = "same";
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '
      - name: Draw the city
        env:
          GITHUB_TOKEN: ${{ secrets.GITWORLD_TOKEN || secrets.GITHUB_TOKEN }}
        run: node gitworld/generate.mjs
      - name: Save the new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/gitworld THEMES.md gitworld.config.json README.md
          git diff --cached --quiet || git commit -m "chore: redraw gitworld city"
          # main may have moved while drawing (e.g. you edited the README); catch up, then push
          git pull --rebase -X theirs || true
          git push
